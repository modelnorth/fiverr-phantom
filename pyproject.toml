[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fiverr-phantom"
version = "0.1.0"
description = "Autonomous Anti-Ban Stealth Automation Suite & MCP Server for Fiverr"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "ModelNorth Sovereign AI", email = "engineering@modelnorth.com" }
]
keywords = ["fiverr", "mcp", "automation", "stealth", "ai-agents", "modelcontextprotocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "patchright>=1.49.0",
    "mcp[cli]>=1.0.0"
]

[project.scripts]
fiverr-phantom = "fiverr_phantom.cli:main"
fiverr-phantom-mcp = "fiverr_phantom.mcp_server:main"
